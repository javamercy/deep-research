[project]
name = "deep-research"
version = "0.1.0"
description = "Build a deep research agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.2",
    "langchain-openrouter>=0.2.9",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langsmith>=0.14.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tavily-python>=0.8.4",
]

[project.scripts]
deep-research = "deep_research:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pyrefly>=1.3.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "evals"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", # Pycodestyle errors
    "W", # Pycodestyle warnings
    "F", # Pyflakes
    "I", # Import sorting
    "B", # Bugbear: common bugs and design issues
    "UP", # Python syntax modernization
    "D", # Docstring conventions
    "SIM", # Simplification suggestions
    "C4", # Comprehension improvements
    "PIE", # Miscellaneous lint cleanups
    "PTH", # Prefer pathlib over os.path
    "ASYNC", # Asyncio best practices
    "TC", # Move type-only imports into TYPE_CHECKING
    "RUF", # Ruff-specific rules (e.g., RUF006, RUF100)
]

ignore = [
    "D1", # Do not require docstrings everywhere
    "D417", # Do not require documenting every argument
    "E501", # Let `ruff format` manage line wrapping (avoids prompt/URL noise)
]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "deep_research.schemas.FrozenBaseModel",
]

[tool.pyrefly]
python-version = "3.13"
python-platform = "all"
project-includes = ["src", "evals", "scripts"]
search-path = ["src", "."]
preset = "default"

[tool.pyrefly.errors]
unused-ignore = "error"