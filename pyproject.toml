[project]
name = "deep-research"
version = "0.1.0"
description = "Build a deep research agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.2",
    "langchain-openrouter>=0.2.9",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langsmith>=0.14.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tavily-python>=0.8.4",
]

[project.scripts]
deep-research = "deep_research:main"

[dependency-groups]
dev = [
    "pyrefly>=1.3.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 999
target-version = "py313"
src = ["src", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-ignore = ["E501"]

[tool.pyrefly]
python-version = "3.13"
search-path = ["src", "."]
preset = "default"

